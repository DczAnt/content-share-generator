<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1080px; height:400px; background:#0a0e27; background-image:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,212,255,.025) 3px,transparent 4px); font-family:'Consolas','Courier New',monospace; color:#e0e8f0; display:flex; align-items:center; padding:36px 56px; overflow:hidden; position:relative; }
  .glitch { position:absolute; inset:0; pointer-events:none; background:linear-gradient(90deg,rgba(255,107,53,.04),transparent 30%,transparent 70%,rgba(0,212,255,.04)); }
  .left { flex:1.6; padding-right:32px; z-index:2; }
  .tag { font-size:14px; color:#00d4ff; letter-spacing:3px; }
  .tag::before { content:'> '; color:#ff6b35; }
  h1 { font-size:32px; line-height:1.35; margin-top:10px; font-weight:700; font-family:'Microsoft YaHei',sans-serif; }
  h1 .cyan { color:#00d4ff; text-shadow:1px 0 #ff6b35; }
  h1 .strike { text-decoration:line-through; text-decoration-color:#ff6b35; color:#506880; }
  .repo { margin-top:14px; font-size:18px; color:#00d4ff; font-weight:700; }
  .repo::before { content:'git clone '; color:#ff6b35; font-size:16px; }
  .sub { margin-top:10px; font-size:14px; color:#8090a8; line-height:1.7; font-family:'Microsoft YaHei',sans-serif; }
  .sub b { color:#e0e8f0; font-weight:600; }
  .sig { margin-top:10px; font-size:14px; color:#506880; font-family:'Microsoft YaHei',sans-serif; }
  .sig .name { color:#ff6b35; font-weight:700; }
  .right { width:180px; display:flex; flex-direction:column; align-items:center; gap:8px; z-index:2; }
  .qr { width:120px; height:120px; background:#e0e8f0; border-radius:4px; padding:8px; display:grid; grid-template-columns:repeat(10,1fr); grid-template-rows:repeat(10,1fr); gap:1px; border:2px solid #00d4ff; box-shadow:0 0 16px rgba(0,212,255,.15); }
  .qr i { background:#0a0e27; border-radius:1px; } .qr i.o { background:#e0e8f0; }
  .qr-label { font-size:12px; color:#00d4ff; letter-spacing:2px; }
  .qr-label b { color:#ff6b35; }
</style>
</head>
