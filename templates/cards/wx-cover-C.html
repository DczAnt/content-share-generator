<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:900px; height:383px; background:#fafafa; font-family:'Georgia','Times New Roman',serif; color:#1a1a1a; display:flex; padding:36px 48px; overflow:hidden; position:relative; }
  .left { flex:1.5; padding-right:32px; display:flex; flex-direction:column; justify-content:space-between; }
  .tag { font-family:'KaiTi','STKaiti',serif; font-size:16px; color:#c0392b; letter-spacing:4px; }
  .tag::after { content:' ｜'; color:#ccc; }
  h1 { font-size:46px; line-height:1.2; margin-top:14px; font-weight:700; letter-spacing:2px; }
  h1 .red { color:#c0392b; }
  h1 .light { color:#999; font-weight:400; }
  .sub { margin-top:12px; font-family:'KaiTi','STKaiti',serif; font-size:17px; color:#666; line-height:1.7; }
  .sub b { color:#1a1a1a; font-weight:700; }
  .repo { font-family:'Consolas',monospace; font-size:14px; color:#1a1a1a; letter-spacing:.5px; }
  .repo::before { content:'→ '; color:#c0392b; }
  .right { flex:1; display:flex; flex-direction:column; justify-content:center; align-items:center; gap:14px; position:relative; }
  .seal { width:80px; height:80px; background:#c0392b; border-radius:4px; display:flex; align-items:center; justify-content:center; color:#fafafa; font-family:'KaiTi','STKaiti',serif; font-size:36px; font-weight:700; transform:rotate(-3deg); box-shadow:2px 2px 0 rgba(192,57,43,.2); }
  .vline { width:1px; height:60px; background:#1a1a1a; opacity:.15; }
  .chip { font-family:'Georgia',serif; font-size:28px; color:#1a1a1a; letter-spacing:4px; font-weight:700; }
  .chip-sub { font-family:'Consolas',monospace; font-size:12px; color:#999; letter-spacing:3px; }
  .stats { display:flex; gap:20px; }
  .stats .s { text-align:center; }
  .stats .v { font-family:'Georgia',serif; font-size:22px; font-weight:700; }
  .stats .v.r { color:#c0392b; } .stats .v.g { color:#2a7a2a; }
  .stats .l { font-size:10px; color:#999; letter-spacing:1px; margin-top:2px; }
  .hline { position:absolute; left:48px; right:48px; bottom:32px; height:1px; background:#1a1a1a; opacity:.1; }
</style>
</head>
<body>
  <div class="left">
    <div>
      <div class="tag">踩坑实录 第三期</div>
      <h1><span class="red">GLIBC</span> 2.34<br><span class="light">找不到？</span></h1>
      <div class="sub">容器编好一上板就崩，<b>十人九中</b>。<br>一条决策树终结兼容地狱。</div>
    </div>
    <div class="repo">github.com/DczAnt/rk3xx-chip-dev</div>
  </div>
  <div class="right">
    <div class="seal">坑</div>
    <div class="vline"></div>
    <div class="chip">RK3576</div>
    <div class="chip-sub">A55 · NEBULA</div>
    <div class="stats">
      <div class="s"><div class="v g">84.27</div><div class="l">FPS</div></div>
      <div class="s"><div class="v r">56</div><div class="l">坑</div></div>
    </div>
  </div>
  <div class="hline"></div>
</body>
</html>
