<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    width:1080px; height:1440px; background:#faf8f3;
    background-image:
      linear-gradient(rgba(44,62,80,.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(44,62,80,.05) 1px, transparent 1px);
    background-size:32px 32px;
    font-family:'KaiTi','STKaiti','Microsoft YaHei',sans-serif; color:#2c3e50;
    display:flex; flex-direction:column; padding:72px 80px; overflow:hidden; position:relative;
  }
  .tag { font-size:24px; color:#c0392b; letter-spacing:2px; font-weight:700; }
  h1 { margin-top:20px; font-size:88px; line-height:1.15; font-weight:700; }
  h1 .red { color:#c0392b; }
  h1 .blue { color:#2980b9; }
  .sub { margin-top:16px; font-size:28px; color:#5d6d7e; line-height:1.6; max-width:800px; }
  .sub b { color:#2c3e50; font-weight:700; }
  .stats { margin-top:44px; display:flex; gap:28px; }
  .stat { flex:1; text-align:center; position:relative; }
  .stat .circle { width:180px; height:180px; border:4px solid #2c3e50; border-radius:50%; margin:0 auto; display:flex; flex-direction:column; align-items:center; justify-content:center; background:#fff; }
  .stat .circle.g { border-color:#27ae60; }
  .stat .circle.o { border-color:#e67e22; }
  .stat .circle.b { border-color:#2980b9; }
  .stat .v { font-family:'Georgia',serif; font-size:56px; font-weight:800; line-height:1; }
  .stat .v.g { color:#27ae60; } .stat .v.o { color:#e67e22; } .stat .v.b { color:#2980b9; }
  .stat .l { font-size:20px; color:#5d6d7e; margin-top:8px; }
  .stat .d { font-family:'Consolas',monospace; font-size:15px; color:#95a5a6; margin-top:4px; }
  .features { margin-top:40px; font-size:26px; line-height:2.1; color:#34495e; }
  .features li { list-style:none; padding-left:36px; position:relative; }
  .features li::before { content:'✓'; position:absolute; left:0; color:#27ae60; font-weight:700; font-size:28px; }
  .star { position:absolute; top:72px; right:80px; font-size:48px; color:#f39c12; transform:rotate(20deg); }
  .foot { margin-top:auto; display:flex; justify-content:space-between; align-items:flex-end; border-top:2px dashed #bdc3c7; padding-top:28px; }
  .repo { font-family:'Consolas',monospace; font-size:28px; color:#2980b9; font-weight:700; }
  .idx { font-size:24px; color:#95a5a6; font-style:italic; }
</style>
</head>
<body>
  <div class="tag">RK3XX 芯片开发 AI 技能包</div>
  <div class="star">★</div>
  <h1>56 个坑 →<br>AI 的<span class="red">记忆</span></h1>
  <div class="sub">坑踩一次，写进技能包，<b>AI 之后所有项目不再踩</b></div>
  <div class="stats">
    <div class="stat"><div class="circle g"><div class="v g">84.27</div></div><div class="l">FPS</div><div class="d">RK3576 · 8路</div></div>
    <div class="stat"><div class="circle o"><div class="v o">56</div></div><div class="l">陷阱沉淀</div><div class="d">+ 46 准则</div></div>
    <div class="stat"><div class="circle b"><div class="v b">6</div></div><div class="l">芯片覆盖</div><div class="d">RK3562~3588</div></div>
  </div>
  <ul class="features">
    <li>参数化无硬编码（registry.yaml 配置）</li>
    <li>多智能体适配（CodeArts/Cursor/Claude）</li>
    <li>references/ + knowledge/ 双库分离</li>
  </ul>
  <div class="foot">
    <span class="repo">github.com/DczAnt/rk3xx-chip-dev</span>
    <span class="idx">03/03 · 套系C</span>
  </div>
</body>
</html>
