<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1080px; height:400px; background:#1a3c34; font-family:'Helvetica Neue','Arial',sans-serif; color:#f5f1e8; display:flex; align-items:center; padding:36px 56px; overflow:hidden; position:relative; }
  .accent-bar { position:absolute; left:0; top:0; width:8px; height:100%; background:#c9a96e; }
  .left { flex:1.6; padding-right:32px; }
  .tag { font-size:13px; color:#c9a96e; letter-spacing:4px; font-weight:700; text-transform:uppercase; }
  h1 { font-size:34px; line-height:1.35; margin-top:12px; font-weight:800; letter-spacing:-.5px; }
  h1 .gold { color:#c9a96e; }
  h1 .strike { text-decoration:line-through; text-decoration-color:#c9a96e; color:#5a7a6e; }
  .repo { margin-top:16px; font-family:'Consolas',monospace; font-size:18px; color:#c9a96e; font-weight:700; }
  .repo::before { content:'→ '; color:#f5f1e8; }
  .sub { margin-top:10px; font-size:15px; color:#8a9a8e; line-height:1.7; font-weight:300; }
  .sub b { color:#f5f1e8; font-weight:600; }
  .sig { margin-top:12px; font-size:14px; color:#5a7a6e; font-weight:300; }
  .sig .name { color:#c9a96e; font-weight:700; }
  .right { width:170px; display:flex; flex-direction:column; align-items:center; gap:8px; }
  .qr { width:120px; height:120px; background:#f5f1e8; border-radius:4px; padding:8px; display:grid; grid-template-columns:repeat(10,1fr); grid-template-rows:repeat(10,1fr); gap:1px; border:3px solid #c9a96e; }
  .qr i { background:#1a3c34; border-radius:1px; } .qr i.o { background:#f5f1e8; }
  .qr-label { font-size:12px; color:#c9a96e; letter-spacing:2px; font-weight:700; }
</style>
</head>
<body>
