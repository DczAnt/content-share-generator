<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1080px; height:600px; background:#fafafa; font-family:'Georgia','Times New Roman',serif; color:#1a1a1a; padding:44px 64px; overflow:hidden; position:relative; }
  .tag { font-family:'KaiTi','STKaiti',serif; font-size:18px; color:#c0392b; letter-spacing:3px; }
  h1 { font-size:34px; line-height:1.25; margin-top:10px; font-weight:700; }
  h1 .red { color:#c0392b; }
  .sub { margin-top:4px; font-family:'KaiTi','STKaiti',serif; font-size:16px; color:#666; }
  table { margin-top:20px; width:100%; border-collapse:collapse; }
  th { padding:12px 16px; text-align:left; font-size:14px; font-weight:700; color:#fafafa; background:#1a1a1a; letter-spacing:1px; }
  td { padding:12px 16px; font-size:16px; border-bottom:1px solid #e0e0e0; font-family:'KaiTi','STKaiti',serif; }
  .metric { font-family:'Consolas',monospace; font-weight:700; font-size:17px; }
  .bad { color:#c0392b; } .good { color:#2a7a2a; } .neu { color:#333; }
  .delta { font-family:'Consolas',monospace; font-weight:700; font-size:15px; color:#2a7a2a; }
  .note { margin-top:14px; font-family:'KaiTi','STKaiti',serif; font-size:14px; color:#666; padding-left:16px; border-left:3px solid #c0392b; }
  .note b { color:#1a1a1a; }
  .seal { position:absolute; right:64px; bottom:60px; width:64px; height:64px; background:#c0392b; border-radius:4px; display:flex; align-items:center; justify-content:center; color:#fafafa; font-family:'KaiTi','STKaiti',serif; font-size:24px; font-weight:700; transform:rotate(4deg); }
  .foot { position:absolute; left:64px; bottom:22px; right:64px; display:flex; justify-content:space-between; align-items:center; }
  .foot .repo { font-family:'Consolas',monospace; font-size:14px; color:#1a1a1a; }
  .foot .repo::before { content:'→ '; color:#c0392b; }
  .foot .idx { font-family:'KaiTi','STKaiti',serif; font-size:14px; color:#999; }
</style>
</head>
<body>
  <div class="tag">实测数据 · RK3576</div>
  <h1>修坑前后对比：<span class="red">84.27 fps</span> 怎么来的</h1>
  <div class="sub">同一模型同一板子，只改了工具链对齐 + NPU 双核调度</div>
  <table>
    <tr><th>指标</th><th>修坑前</th><th>修坑后</th><th>提升</th></tr>
    <tr><td>能否上板</td><td><span class="metric bad">崩</span> GLIBC_2.34</td><td><span class="metric good">✓</span> 正常起推理</td><td><span class="delta">0 → 1</span></td></tr>
    <tr><td>NPU 双核利用率</td><td><span class="metric bad">0%</span> fallback CPU</td><td><span class="metric good">~92%</span></td><td><span class="delta">+92 pts</span></td></tr>
    <tr><td>端到端 FPS</td><td><span class="metric neu">11.4</span></td><td><span class="metric good">84.27</span></td><td><span class="delta">×7.4</span></td></tr>
    <tr><td>单帧延迟</td><td><span class="metric neu">87.7 ms</span></td><td><span class="metric good">11.87 ms</span></td><td><span class="delta">÷7.4</span></td></tr>
  </table>
  <div class="note">数据来源：<b>ai_video_monitor_rk3576</b> 实测 · YOLOv8n 640×640 · 1080p 输入</div>
  <div class="seal">印</div>
  <div class="foot">
    <span class="repo">github.com/DczAnt/rk3xx-chip-dev</span>
    <span class="idx">数据 · 套系C</span>
  </div>
</body>
</html>
